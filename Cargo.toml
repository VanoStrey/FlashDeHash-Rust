[workspace]
resolver = "2"
members = [
    "crates/fdh-core",
    "crates/fdh-cli",
    "crates/fdh-bot",
    "crates/fdh-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["FlashDeHash Contributors"]
license = "MIT"

[workspace.dependencies]
fdh-core = { path = "crates/fdh-core" }
fdh-bot = { path = "crates/fdh-bot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
memmap2 = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
blake3 = "1.8"
crc32fast = "1.4"
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
eframe = "0.31"
rfd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
